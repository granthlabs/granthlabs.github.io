name: Site
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    # `cancel-in-progress: false` above is the Pages recommendation and correct —
    # a half-written deploy is worse than a slow one. But it means a hung run
    # holds the `pages` group for as long as it lives, and GitHub's default is
    # SIX HOURS. One did exactly that: every later push queued behind it, the
    # site quietly stopped updating, and the runs showing [X] had been CANCELLED
    # by the queue rather than having failed. Nothing said so.
    #
    # A full run is 15-20 minutes, most of it Playwright. 35 bounds a hang to
    # something noticeable without firing on a slow browser download.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      # No workspace build: this repo installs granthdb from npm on purpose, so
      # the hosted sandbox, demos and showcase exercise the PUBLISHED library —
      # exactly what a visitor downloads.
      # `npm ci` against a COMMITTED lockfile. Two independent `npm install`s
      # sharing a hoisted tree is how CI got vitepress's vite@8 under a plugin
      # that requires vite@5 — a resolution that could not happen locally, and a
      # lockfile-free install is free to differ from run to run anyway.
      - run: npm ci
      - run: npm run docs:build

      # A handful of page sources necessarily exist in both repos. Nothing
      # watches duplication by default, so this does — it fails if the site and
      # granthlabs/granth disagree about a shared file.
      - run: node examples/playground/drift-check.mjs

      - run: npx playwright install --with-deps chromium
      - run: node examples/playground/link-check.mjs
      # Fetching a URL and clicking a link are different acts: /play/ is not a
      # VitePress route, so a click used to get the SPA's 404 while every fetch
      # said 200.
      - run: node examples/playground/spa-exit-test.mjs
      - run: node examples/playground/hosted-play-test.mjs
      - run: node examples/playground/showcase-test.mjs
      - run: node examples/playground/ledger-test.mjs
      - run: node examples/playground/flash-probe.mjs

      - uses: actions/configure-pages@v5
        with: { enablement: true }
      - uses: actions/upload-pages-artifact@v3
        with: { path: docs/.vitepress/dist }
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Seconds in practice; it holds the same concurrency group, so it gets a
    # bound for the same reason.
    timeout-minutes: 10
    environment: { name: github-pages, url: '${{ steps.deployment.outputs.page_url }}' }
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
